%%writefile .github/workflows/main.yml
name: MLOps CI/CD Pipeline
on:
push:
branches: [ main ]
pull_request:
branches: [ main ]
jobs:
build-and-test:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.11'
- name: Install dependencies
run: |
python -m pip install --upgrade pip
pip install numpy pandas scikit-learn joblib pytest flask
- name: Train model
run: python train.py
- name: Run unit tests
run: pytest test_model.py -v
deploy:
needs: build-and-test
runs-on: ubuntu-latest
if: github.ref == 'refs/heads/main'
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Deploy to cloud platform
run: |
echo "Deploying trained model and Flask API..."
